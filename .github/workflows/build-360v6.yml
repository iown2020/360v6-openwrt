name: Build 360V6 ImmortalWrt

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  # 使用 LibWrt 25.12-nss：内核/驱动侧已合入 QCA NSS 补丁，ImmortalWrt 官方分支不含 qca-nss-drv/ecm
  REPO_URL: https://github.com/LiBwrt/LibWrt.git
  REPO_BRANCH: 25.12-nss
  CONFIG_FILE: .config
  DIY_SCRIPT: diy.sh
  FILES_DIR: files
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Initialization Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib \
          git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
          libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz \
          mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip libpython3-dev qemu-utils \
          rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"

    - name: Maximize Build Space
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: 2048
        swap-size-mb: 1024
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'

    - name: Checkout
      uses: actions/checkout@v4

    - name: Clone Source Code
      run: |
        df -h
        git clone --depth 1 -b $REPO_BRANCH $REPO_URL openwrt

    - name: Update & Install Feeds
      run: |
        cd openwrt
        # 追加 EasyTier 源并锁定官方 v2.4.5 tag（该 tag 内 easytier/Makefile 已固定 PKG_VERSION:=2.4.5）
        echo "src-git easytier https://github.com/EasyTier/luci-app-easytier.git;v2.4.5" >> feeds.conf.default
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Load Custom Configuration & Files
      run: |
        [ -e $FILES_DIR ] && cp -rf $FILES_DIR openwrt/files
        chmod +x openwrt/files/etc/uci-defaults/* 2>/dev/null || true
        [ -e $DIY_SCRIPT ] && chmod +x $DIY_SCRIPT && ./$DIY_SCRIPT
        [ -e $CONFIG_FILE ] && cp -f $CONFIG_FILE openwrt/.config
        cd openwrt
        make defconfig
        echo "=== 检查目标架构 ==="
        grep 'CONFIG_TARGET_BOARD="qualcommax"' .config || (echo "错误：目标平台未被正确设为 qualcommax！" && exit 1)
        grep 'CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_qihoo_360v6=y' .config || (echo "错误：目标设备未被正确设为 360v6！" && exit 1)
        echo "=== 检查 NSS 硬件加速 ==="
        for sym in CONFIG_PACKAGE_kmod-qca-nss-drv=y CONFIG_PACKAGE_kmod-qca-nss-dp=y \
                   CONFIG_PACKAGE_kmod-qca-nss-ecm=y CONFIG_NSS_DRV_PPPOE_ENABLE=y \
                   CONFIG_NSS_DRV_IPV6_ENABLE=y; do
          grep -q "^$sym$" .config || (echo "错误：NSS 配置项缺失 -> $sym" && exit 1)
        done
        echo "=== 检查 EasyTier 2.4.5 ==="
        for sym in CONFIG_PACKAGE_easytier=y CONFIG_PACKAGE_luci-app-easytier=y; do
          grep -q "^$sym$" .config || (echo "错误：EasyTier 配置项缺失 -> $sym" && exit 1)
        done
        if grep -q 'CONFIG_PACKAGE_luci-app-passwall=y' .config; then
          echo "错误：Passwall 仍在配置中！"
          exit 1
        fi
        echo "目标架构、NSS、EasyTier 校验通过（Passwall 已移除）！"

    - name: Download Package Dependencies
      id: package
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the Firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Check Space Usage
      if: (!cancelled())
      run: df -h

    - name: Organize Firmware Files
      id: organize
      if: steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        cd openwrt/bin/targets/qualcommax/ipq60xx
        rm -rf packages
        echo "FIRMWARE_PATH=$PWD" >> $GITHUB_ENV
        echo "TAG_NAME=360V6-$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload Firmware to Release
      uses: softprops/action-gh-release@v2
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        tag_name: ${{ env.TAG_NAME }}
        name: 奇虎 360 V6 固件 (${{ env.TAG_NAME }})
        body: |
          ### 奇虎 360 V6 (IPQ6000) LibWrt 25.12 固件（NSS 硬件加速版）

          #### 特性亮点
          - 底包：LibWrt `25.12-nss`（ImmortalWrt 25.12 软件源），Linux 6.12
          - 硬件加速：真正启用 QCA NSS 卸载（NSS Core/DRV + ECM + NSS DP），PPPoE / IPv6 / VLAN / Wi-Fi 走硬件流表
          - 组网：内置 EasyTier `v2.4.5`（aarch64，含 LuCI 界面），由官方 v2.4.5 tag 源码构建
          - 精简：已移除 Passwall 及全部依赖（Xray / Sing-box / ChinaDNS-NG）
          - 网络：关闭 PPPoE LCP keepalive（默认 `5 3` 过于激进，链路抖动会触发重拨）
          - 出厂加固：
            - CPU 频率上限锁定 1.2 GHz（防止原装老化电源触发过流锁存）
            - 5G / 2.4G Wi-Fi 默认纯 WPA2-PSK，关闭 PMF，规避 ath11k 闭源微码死锁
            - 内核连续内存预留 16MB（`vm.min_free_kbytes=16384`）
            - 默认关闭 fw4 软件分流 / 硬件分流 / FullCone 与 Packet Steering，避免与 NSS ECM 冲突

          #### 默认访问信息
          - 管理地址：`192.168.50.1`
          - 管理密码：`password`
          - Wi-Fi 名称：`2024`（2.4G / 5G 同名）
          - Wi-Fi 密码：`20242024`（WPA2-PSK）
        files: |
          ${{ env.FIRMWARE_PATH }}/*qihoo_360v6*
          ${{ env.FIRMWARE_PATH }}/sha256sums
          ${{ env.FIRMWARE_PATH }}/config.buildinfo
